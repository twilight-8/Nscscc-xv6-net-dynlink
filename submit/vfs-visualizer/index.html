<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>xv6fs Folder Demo</title>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <main class="window">
      <header class="titlebar">
        <div class="window-controls" aria-hidden="true">
          <span></span>
          <span></span>
          <span></span>
        </div>
        <div>
          <h1>xv6fs</h1>
          <p>/</p>
        </div>
        <div class="stage">Stage A · VFS wrapper</div>
      </header>

      <nav class="toolbar" aria-label="file actions">
        <button id="new-file" title="Create file">New File</button>
        <button id="new-folder" title="Create folder">New Folder</button>
        <button id="rename" title="Rename selected item">Rename</button>
        <button id="delete" title="Delete selected item">Delete</button>
        <button id="save" title="Save file content">Save</button>
        <button id="reset" title="Reset demo state">Reset</button>
      </nav>

      <section class="pathbar">
        <span>Location</span>
        <strong>/</strong>
        <em id="status-text">xv6 root filesystem demo</em>
      </section>

      <section class="content">
        <aside class="sidebar">
          <button class="mount active" data-fs="xv6fs">
            <span>xv6fs</span>
            <small>/</small>
          </button>
          <button class="mount disabled" data-fs="ext2" title="Available after Stage B/C">
            <span>ext2</span>
            <small>/mnt</small>
          </button>
          <button class="mount disabled" data-fs="fat32" title="Available after Stage D">
            <span>fat32</span>
            <small>/fat32</small>
          </button>
        </aside>

        <section class="folder-view">
          <div class="folder-head">
            <span>Name</span>
            <span>Type</span>
            <span>Size</span>
          </div>
          <div id="file-list" class="file-list"></div>
        </section>

        <section class="editor-pane">
          <div class="editor-head">
            <div>
              <span id="selected-path">No file selected</span>
              <small id="selected-meta">select a regular file to edit</small>
            </div>
            <span id="dirty-state">clean</span>
          </div>
          <textarea id="editor" spellcheck="false" disabled></textarea>
        </section>
      </section>

      <footer class="footer">
        <div>
          <strong>VFS path</strong>
          <span id="vfs-path">select a file</span>
        </div>
        <div>
          <strong>Log</strong>
          <span id="log-line">ready</span>
        </div>
      </footer>
    </main>

    <script src="app.js"></script>
  </body>
</html>
